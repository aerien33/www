<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Website Name</title>
    <meta name="description" content="Description placeholder">
    <link rel="stylesheet"  href="../styles/upload.css">
</head>
<body>
<div class="page">
    <div class="top-bar">
        <header class="top-bar__logo">LOGO</header>
    </div>
    <div class="content">
        <div class="tiles content__tiles">
            <div class="tile form__tile">
                <h2 class="header upload__header">Create New Post</h2> <br>
                <form class="form__inside">
                    <div class="form__item">
                        <label class="upload__label" for="title">Title</label>
                        <input class="input upload__input" type="text" id="title" name="title" required>
                    </div>
                    <div class="form__item">
                        <label class="upload__label" for="content">Content</label>
                        <textarea class="input upload__textarea" id="content" name="content" rows="20" cols="50"> </textarea>
                    </div>
                    <button class="button upload__button" type="submit" name="send">Send</button>
                </form>
            </div>
            <div class="back">
                <h2><a class="link back__link" href="../index.html">Back</a></h2>
            </div>
        </div>
    </div>
    <div class="footer">
        <i>Created by Agnieszka Wawer, 2026-2027</i>
    </div>
</div>
</body>
</html>
